        stroke="#ffffff" stroke-opacity="0.9" stroke-width="16"
        stroke-linejoin="round"/>

  <!-- camera lens -->
  <circle cx="256" cy="300" r="74" fill="#0d1b2e" fill-opacity="0.55"/>
  <circle cx="256" cy="300" r="74" fill="none" stroke="url(#lens)" stroke-width="16"/>
  <circle cx="256" cy="300" r="40" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="12"/>
  <circle cx="238" cy="282" r="12" fill="#ffffff" fill-opacity="0.95"/>

  <!-- AI spark -->
  <path d="M356 150 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 Z" fill="#7cf9d8"/>
  <!-- SmartHome+ plus -->
