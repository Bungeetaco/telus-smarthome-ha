download_clip:
  name: Download clip
  description: >-
    Save a TELUS recorded clip as an MP4 in Home Assistant's media folder
    (media/telus_clips). With no clip_id, saves the newest clip.
  fields:
    device_id:
      name: Camera device ID
      description: TELUS camera id (e.g. odc-40D95A456B30). Defaults to the first camera.
      required: false
      example: odc-40D95A456B30
      selector:
        text:
    clip_id:
      name: Clip ID
      description: Clip id from the Media browser / clip list. Defaults to the newest clip.
      required: false
      example: odc-40D95A456B30-1792778069
      selector:
        text:
    folder:
      name: Save folder
      description: Folder to save into. Defaults to the folder set in the integration options.
      required: false
      example: /media/nas/cameras
      selector:
        text:

send_command:
  name: Send device command
  description: >-
    Low-level: POST a single send-commands operation to a TELUS device
    (capabilityIdentifier + operation). For actuators like the doorbell siren,
    spotlight and HDR whose entities are not built yet, and for debugging.
  fields:
    device_id:
      name: Device ID
      description: TELUS device/asset id (e.g. db-...).
      required: true
      selector:
        text:
    capability_identifier:
      name: Capability identifier
      description: The capabilityIdentifier string (e.g. binarySwitch, hdr, siren, spotlight).
      required: true
      selector:
        text:
    operation:
      name: Operation
      description: The operation string (e.g. on, off, true, false, setMode:on).
      required: true
      selector:
        text:
    connector_id:
      name: Connector ID
      description: Override; defaults to the device's connectorId.
      required: false
      selector:
        text:
    group_id:
      name: Group ID
      required: false
      selector:
        text:
    provider:
      name: Provider
      description: Override; defaults to the device's provider.
      required: false
      selector:
        text:
